<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cross-read numerology, astrology, Kyusei, and more from your birth date and name. Includes love archetype and compatibility readings.">
  <meta name="theme-color" content="#06050f">
  <link rel="canonical" href="https://tannyann.github.io/cosmic-id/">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta property="og:title" content="COSMIC ID — Personal Cosmology">
  <meta property="og:description" content="Nineteen stories within you — plus your love type and compatibility. Many systems, one reading.">
  <meta property="og:type" content="website">
  <meta property="og:image" id="meta-og-image" content="https://tannyann.github.io/cosmic-id/og.png">
  <meta property="og:image:width" content="1080">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="COSMIC ID — Personal Cosmology">
  <meta property="og:url" id="meta-og-url" content="https://tannyann.github.io/cosmic-id/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" id="meta-twitter-image" content="https://tannyann.github.io/cosmic-id/og.png">
  <title>COSMIC ID — Personal Cosmology</title>
  <script type="application/ld+json" id="ld-json"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="container">
    <header class="site-header">
      <div class="header-top">
        <p class="eyebrow" id="header-eyebrow">Personal Cosmology</p>
        <div class="lang-toggle" id="lang-toggle" role="group" aria-label="Language">
          <button type="button" class="lang-toggle-btn" data-locale="ja" aria-pressed="false">日本語</button>
          <button type="button" class="lang-toggle-btn" data-locale="en" aria-pressed="true">English</button>
        </div>
      </div>
      <h1><span class="deco" aria-hidden="true">✦</span>COSMIC ID<span class="deco" aria-hidden="true">✦</span></h1>
      <p class="subtitle" id="header-subtitle">Nineteen stories — plus love and compatibility readings</p>
      <div class="header-ornament" aria-hidden="true"></div>
    </header>

    <div class="form-card">
      <p class="form-free-badge" id="form-free-badge">Free to use — always</p>
      <form id="form">
        <div class="form-row form-row-names" id="form-row-names">
          <div class="field field-name-primary">
            <label for="name" id="label-name">Your name</label>
            <input type="text" id="name" placeholder="e.g. Alex Morgan" autocomplete="name" required>
            <p class="field-hint" id="hint-name"></p>
          </div>
          <div class="field field-name-roman" id="field-name-roman">
            <label for="name-roman" id="label-name-roman">Roman letters (optional)</label>
            <input type="text" id="name-roman" placeholder="e.g. YAMADA TARO" autocomplete="off" inputmode="latin" spellcheck="false">
            <p class="field-hint" id="hint-name-roman"></p>
          </div>
        </div>
        <div class="form-row form-row-action">
          <div class="field field-birth">
            <span class="field-group-label" id="label-birth">Date of birth</span>
            <div class="birth-date-grid" role="group" aria-labelledby="label-birth">
              <div class="birth-date-part">
                <label for="birth-month" id="label-birth-month">Month</label>
                <select id="birth-month" required></select>
              </div>
              <div class="birth-date-part">
                <label for="birth-day" id="label-birth-day">Day</label>
                <select id="birth-day" required></select>
              </div>
              <div class="birth-date-part">
                <label for="birth-year" id="label-birth-year">Year</label>
                <select id="birth-year" required></select>
              </div>
            </div>
            <input type="hidden" id="birthdate">
            <p class="field-hint" id="hint-birth" aria-live="polite"></p>
          </div>
          <button type="submit" class="btn-primary" id="btn-submit">Reveal</button>
        </div>
        <p class="form-privacy" id="form-privacy"></p>
        <p class="profile-restored-hint" id="profile-restored-hint" hidden></p>
      </form>
    </div>

    <div class="results" id="results"></div>

    <section id="premium-showcase" class="premium-showcase" aria-label="What's included"></section>

    <footer>
      <span id="footer-line1">COSMIC ID — Personal Cosmology Prototype</span><br>
      <span id="footer-line2">Every reading is one possibility. You write your story.</span>
      <p class="footer-legal">
        <a href="./legal.html" id="footer-legal">Legal</a>
      </p>
    </footer>
  </div>

  <!-- モーダルは .container 外（inert がダイアログを無効化しないため） -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" id="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-heading" tabindex="-1">
      <button type="button" class="modal-close" id="modal-close" aria-label="Close">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="share-modal-backdrop" id="share-modal" hidden>
    <div class="share-modal" id="share-modal-dialog" role="dialog" aria-modal="true" aria-label="Share card" tabindex="-1">
      <button type="button" class="modal-close" id="share-modal-close" aria-label="Close">×</button>
      <img id="share-modal-img" class="share-modal-img" alt="Share card preview">
      <div class="share-modal-actions">
        <button type="button" class="share-btn share-btn-primary" data-share-modal="save">Save image</button>
        <button type="button" class="share-btn" data-share-modal="x">X</button>
        <button type="button" class="share-btn" data-share-modal="line">LINE</button>
        <button type="button" class="share-btn" data-share-modal="copy">Copy text</button>
        <button type="button" class="share-btn" data-share-modal="native" id="share-modal-native">Share…</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
