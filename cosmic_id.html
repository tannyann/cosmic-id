<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COSMIC ID — 個人統合占断</title>
<style>
:root {
  --bg-deep: #0a0816;
  --bg-card: rgba(30, 25, 60, 0.55);
  --gold: #d4af37;
  --gold-bright: #f5d76e;
  --cream: #f0e6d2;
  --text-muted: #a89cc6;
  --accent-purple: #8b5fbf;
  --accent-rose: #d4799a;
  --border: rgba(212, 175, 55, 0.22);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
  background:
    radial-gradient(ellipse at 20% 10%, #1a1338 0%, transparent 60%),
    radial-gradient(ellipse at 80% 90%, #2a1845 0%, transparent 60%),
    var(--bg-deep);
  background-attachment: fixed;
  color: var(--cream);
  min-height: 100vh;
  line-height: 1.75;
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 23%, white, transparent),
    radial-gradient(1px 1px at 38% 67%, white, transparent),
    radial-gradient(1px 1px at 55% 41%, white, transparent),
    radial-gradient(2px 2px at 78% 18%, var(--gold-bright), transparent),
    radial-gradient(1px 1px at 88% 72%, white, transparent),
    radial-gradient(1.5px 1.5px at 28% 88%, var(--cream), transparent),
    radial-gradient(1px 1px at 64% 92%, white, transparent),
    radial-gradient(1px 1px at 7% 55%, var(--gold), transparent),
    radial-gradient(1.5px 1.5px at 92% 35%, white, transparent),
    radial-gradient(1px 1px at 45% 12%, white, transparent);
  opacity: 0.7;
  pointer-events: none;
  z-index: 0;
  animation: twinkle 8s ease-in-out infinite alternate;
}

@keyframes twinkle {
  from { opacity: 0.5; }
  to { opacity: 0.85; }
}

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 60px 24px 80px;
  position: relative;
  z-index: 1;
}

header {
  text-align: center;
  margin-bottom: 50px;
}

h1 {
  font-size: 44px;
  font-weight: 300;
  letter-spacing: 0.25em;
  color: var(--gold-bright);
  margin-bottom: 14px;
  text-shadow: 0 0 30px rgba(245, 215, 110, 0.3);
}

h1 .deco {
  color: var(--gold);
  font-size: 0.55em;
  margin: 0 18px;
  vertical-align: middle;
}

.subtitle {
  color: var(--text-muted);
  letter-spacing: 0.2em;
  font-size: 13px;
}

.form-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 36px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  margin-bottom: 40px;
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4),
              0 0 80px rgba(139, 95, 191, 0.08);
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 20px;
  align-items: end;
}

@media (max-width: 720px) {
  .form-row { grid-template-columns: 1fr; }
  h1 { font-size: 32px; }
}

label {
  display: block;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--text-muted);
  margin-bottom: 8px;
  text-transform: uppercase;
}

input[type=text], input[type=date] {
  width: 100%;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid var(--border);
  color: var(--cream);
  padding: 13px 16px;
  font-size: 16px;
  border-radius: 7px;
  font-family: inherit;
  transition: all 0.3s;
}

input:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
}

button {
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-bright) 100%);
  color: #1a1338;
  border: none;
  padding: 14px 32px;
  font-size: 13px;
  letter-spacing: 0.2em;
  font-weight: 700;
  cursor: pointer;
  border-radius: 7px;
  font-family: inherit;
  transition: all 0.25s;
  text-transform: uppercase;
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 24px rgba(212, 175, 55, 0.4);
}

button:active { transform: translateY(0); }

.results { display: none; opacity: 0; transition: opacity 0.6s; }
.results.active { display: block; opacity: 1; }

.hero-card {
  text-align: center;
  background: linear-gradient(135deg,
    rgba(139, 95, 191, 0.25),
    rgba(212, 121, 154, 0.18));
  border: 1px solid var(--gold);
  border-radius: 14px;
  padding: 44px 30px;
  margin-bottom: 40px;
  box-shadow: 0 0 60px rgba(212, 175, 55, 0.1);
}

.hero-name {
  font-size: 34px;
  color: var(--gold-bright);
  margin-bottom: 12px;
  letter-spacing: 0.1em;
  font-weight: 300;
}

.hero-meta {
  color: var(--cream);
  letter-spacing: 0.08em;
  font-size: 14px;
  opacity: 0.9;
}

.hero-meta strong {
  color: var(--gold-bright);
  font-weight: 400;
}

.section-title {
  font-size: 17px;
  letter-spacing: 0.25em;
  color: var(--gold);
  margin: 50px 0 22px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}

.section-title::before {
  content: '◇';
  color: var(--gold-bright);
  font-size: 0.85em;
}

.section-en {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.3em;
  margin-left: auto;
  font-weight: 300;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 18px;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 24px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}

.card:hover {
  transform: translateY(-2px);
  border-color: rgba(212, 175, 55, 0.5);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
}

.card:hover::before { opacity: 1; }

.card-system {
  font-size: 10px;
  letter-spacing: 0.25em;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 10px;
}

.card-value {
  font-size: 30px;
  color: var(--gold-bright);
  margin-bottom: 6px;
  letter-spacing: 0.04em;
  font-weight: 300;
  line-height: 1.2;
}

.card-label {
  font-size: 13px;
  color: var(--accent-purple);
  margin-bottom: 12px;
  letter-spacing: 0.08em;
}

.card-desc {
  font-size: 13.5px;
  color: var(--cream);
  opacity: 0.88;
  line-height: 1.8;
}

.biorhythm-chart {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 26px;
  backdrop-filter: blur(10px);
}

.biorhythm-chart .card-system { margin-bottom: 18px; }

.bio-bar {
  display: grid;
  grid-template-columns: 70px 1fr 50px;
  align-items: center;
  gap: 16px;
  margin: 14px 0;
}

.bio-label {
  font-size: 12px;
  letter-spacing: 0.15em;
  color: var(--cream);
}

.bio-track {
  height: 8px;
  background: rgba(0, 0, 0, 0.4);
  border-radius: 4px;
  position: relative;
  overflow: hidden;
}

.bio-center {
  position: absolute;
  left: 50%;
  top: -2px; bottom: -2px;
  width: 1px;
  background: rgba(212, 175, 55, 0.3);
}

.bio-fill {
  position: absolute;
  height: 100%;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--accent-purple), var(--gold-bright));
  transition: width 1.2s ease;
}

.bio-fill.neg {
  background: linear-gradient(90deg, var(--accent-rose), var(--accent-purple));
}

.bio-value {
  text-align: right;
  font-size: 13px;
  color: var(--gold-bright);
  font-family: 'SF Mono', Menlo, monospace;
}

.moon-card {
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 28px;
  align-items: center;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 26px;
  margin-top: 18px;
  backdrop-filter: blur(10px);
}

.moon {
  width: 100px;
  height: 100px;
}

.moon svg { width: 100%; height: 100%; display: block; }

footer {
  margin-top: 70px;
  text-align: center;
  color: var(--text-muted);
  font-size: 11px;
  letter-spacing: 0.2em;
  line-height: 2;
}

.note {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 8px;
  font-style: italic;
  opacity: 0.7;
}

/* ===== 文章サマリー ===== */
.summary-card {
  background: linear-gradient(135deg,
    rgba(212, 175, 55, 0.08),
    rgba(139, 95, 191, 0.14));
  border: 1px solid var(--border);
  border-left: 3px solid var(--gold);
  border-radius: 11px;
  padding: 36px 40px;
  margin-bottom: 40px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.summary-label {
  font-size: 11px;
  color: var(--gold);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  margin-bottom: 18px;
}

.summary-lead {
  font-size: 19px;
  color: var(--gold-bright);
  margin-bottom: 18px;
  letter-spacing: 0.04em;
  line-height: 1.75;
  font-weight: 300;
}

.summary-card p {
  font-size: 14.5px;
  line-height: 2.1;
  margin-bottom: 14px;
  color: var(--cream);
  opacity: 0.95;
}

.summary-card p:last-child { margin-bottom: 0; }

.summary-card strong {
  color: var(--gold-bright);
  font-weight: 400;
}

/* ===== カードのクリック可能化 ===== */
.card {
  cursor: pointer;
  position: relative;
}

.card-more {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed rgba(212, 175, 55, 0.2);
  font-size: 10px;
  color: var(--gold);
  letter-spacing: 0.25em;
  text-transform: uppercase;
  text-align: right;
  transition: color 0.2s;
}

.card:hover .card-more { color: var(--gold-bright); }

.card-more::after {
  content: ' →';
  margin-left: 4px;
}

/* ===== プレミアムトグル(デモ) ===== */
.premium-toggle {
  text-align: right;
  margin-bottom: 16px;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.15em;
}

.premium-toggle label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 20px;
  transition: all 0.25s;
}

.premium-toggle label:hover {
  border-color: var(--gold);
  color: var(--gold-bright);
}

.premium-toggle input {
  accent-color: var(--gold);
  cursor: pointer;
}

/* ===== モーダル ===== */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(10, 8, 22, 0.88);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.modal-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}

.modal {
  background: linear-gradient(180deg, rgba(30, 25, 60, 0.96), rgba(20, 15, 40, 0.96));
  border: 1px solid var(--gold);
  border-radius: 14px;
  max-width: 680px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 44px 40px 40px;
  position: relative;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6),
              0 0 100px rgba(212, 175, 55, 0.08);
  transform: translateY(20px) scale(0.98);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.modal-backdrop.open .modal {
  transform: translateY(0) scale(1);
}

.modal::-webkit-scrollbar { width: 8px; }
.modal::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
.modal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.modal-close {
  position: absolute;
  top: 16px; right: 16px;
  background: transparent;
  color: var(--text-muted);
  border: 1px solid var(--border);
  width: 34px; height: 34px;
  padding: 0;
  border-radius: 50%;
  font-size: 16px;
  letter-spacing: 0;
  font-weight: 300;
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-close:hover {
  color: var(--gold);
  border-color: var(--gold);
  transform: none;
  box-shadow: none;
}

.modal-system {
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 12px;
}

.modal-value {
  font-size: 38px;
  color: var(--gold-bright);
  letter-spacing: 0.05em;
  font-weight: 300;
  margin-bottom: 8px;
  line-height: 1.2;
}

.modal-label {
  font-size: 14px;
  color: var(--accent-purple);
  letter-spacing: 0.12em;
  margin-bottom: 28px;
}

.modal-section { margin-top: 30px; }

.modal-section-title {
  font-size: 12px;
  letter-spacing: 0.3em;
  color: var(--gold);
  text-transform: uppercase;
  padding-bottom: 12px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--border);
}

.modal-intro {
  font-size: 14.5px;
  line-height: 2;
  color: var(--cream);
  opacity: 0.95;
  margin-bottom: 20px;
}

.detail-list { margin-top: 16px; }

.detail-item {
  margin-bottom: 22px;
  padding-left: 18px;
  border-left: 2px solid rgba(139, 95, 191, 0.5);
}

.detail-item:last-child { margin-bottom: 0; }

.detail-title {
  font-size: 12px;
  color: var(--gold);
  letter-spacing: 0.18em;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.detail-text {
  font-size: 14px;
  line-height: 1.95;
  color: var(--cream);
  opacity: 0.92;
}

/* ===== プレミアムセクション ===== */
.premium-section {
  margin-top: 36px;
  position: relative;
  padding: 26px;
  background: linear-gradient(135deg,
    rgba(212, 175, 55, 0.06),
    rgba(139, 95, 191, 0.1));
  border: 1px solid var(--gold);
  border-radius: 11px;
  overflow: hidden;
}

.premium-badge {
  font-size: 11px;
  letter-spacing: 0.25em;
  color: var(--gold-bright);
  text-transform: uppercase;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.lock-svg {
  width: 13px;
  height: 13px;
  fill: var(--gold-bright);
  vertical-align: middle;
}

.premium-content {
  position: relative;
  min-height: 260px;
}

.premium-items {
  filter: blur(5px);
  user-select: none;
  pointer-events: none;
  transition: filter 0.5s;
}

.premium-section.unlocked .premium-items {
  filter: none;
  user-select: auto;
  pointer-events: auto;
}

.premium-overlay {
  position: absolute;
  inset: -10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: radial-gradient(circle at center,
    rgba(10, 8, 22, 0.6),
    rgba(10, 8, 22, 0.95) 70%);
  border-radius: 6px;
  padding: 20px;
}

.premium-section.unlocked .premium-overlay { display: none; }

.premium-icon {
  width: 44px;
  height: 44px;
  margin-bottom: 14px;
  opacity: 0.9;
}

.premium-pitch {
  font-size: 20px;
  color: var(--gold-bright);
  margin-bottom: 10px;
  letter-spacing: 0.1em;
  font-weight: 300;
}

.premium-sub {
  font-size: 13px;
  color: var(--cream);
  opacity: 0.85;
  margin-bottom: 22px;
  max-width: 420px;
  line-height: 1.85;
}

.cta-button {
  background: linear-gradient(135deg, var(--gold), var(--gold-bright));
  color: #1a1338;
  border: none;
  padding: 13px 32px;
  font-size: 12px;
  letter-spacing: 0.25em;
  font-weight: 700;
  text-transform: uppercase;
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.25s;
}

.cta-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(212, 175, 55, 0.45);
}

.cta-price {
  margin-top: 14px;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.18em;
}

@media (max-width: 700px) {
  .summary-card { padding: 26px 22px; }
  .summary-lead { font-size: 17px; }
  .modal { padding: 32px 22px 26px; }
  .modal-value { font-size: 30px; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1><span class="deco">✦</span>COSMIC ID<span class="deco">✦</span></h1>
    <p class="subtitle">あなたの中に書かれた、十九の物語</p>
  </header>

  <div class="form-card">
    <form id="form">
      <div class="form-row">
        <div>
          <label>お名前</label>
          <input type="text" id="name" placeholder="例:山田 太郎" required>
        </div>
        <div>
          <label>生年月日</label>
          <input type="date" id="birthdate" required>
        </div>
        <button type="submit">読み解く</button>
      </div>
    </form>
  </div>

  <div class="premium-toggle">
    <label title="プレミアム購入後の体験をプレビューします">
      <input type="checkbox" id="demo-premium"> プレミアム体験(デモ)
    </label>
  </div>

  <div class="results" id="results"></div>

  <!-- ===== モーダル ===== -->
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <button class="modal-close" id="modal-close" aria-label="閉じる">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer>
    COSMIC ID — Personal Cosmology Prototype<br>
    すべての解釈は一つの可能性。あなたの物語はあなたが書く。
  </footer>
</div>

<script>
'use strict';

// ============ 数秘術 ============
function reduceDigit(n, keepMaster) {
  while (n > 9) {
    if (keepMaster && (n === 11 || n === 22 || n === 33)) return n;
    n = String(n).split('').reduce((s, c) => s + +c, 0);
  }
  return n;
}

function lifePath(y, m, d) {
  let sum = String(y).split('').reduce((s, c) => s + +c, 0)
          + String(m).split('').reduce((s, c) => s + +c, 0)
          + String(d).split('').reduce((s, c) => s + +c, 0);
  return reduceDigit(sum, true);
}

const lifePathMeanings = {
  1: { label: '指導者・開拓者', desc: '独立心と先駆性を持つ魂。新しい道を切り拓くために来た。' },
  2: { label: '調和者・協力者', desc: '繊細な感受性で人と人を結ぶ。受容と直感の人。' },
  3: { label: '表現者・芸術家', desc: '創造性と喜びを世界に広げる。言葉と色彩の使い手。' },
  4: { label: '建設者・職人', desc: '堅実に基盤を築く魂。秩序と忍耐で形を成す。' },
  5: { label: '自由人・冒険者', desc: '変化と経験を糧にする。風のように制約を嫌う。' },
  6: { label: '愛の人・調停者', desc: '家族や共同体への深い愛情。美しさと責任を担う。' },
  7: { label: '探求者・神秘家', desc: '内側に深く潜る魂。真理を求める静かな観察者。' },
  8: { label: '実現者・経営者', desc: '物質と精神の両方を司る力。豊かさを形にする。' },
  9: { label: '人道家・完成者', desc: '広く愛し、手放すことを知る魂。一つの旅の完成形。' },
  11: { label: 'マスター11 — 啓示者', desc: '高い直感で光を運ぶ魂。緊張と霊性の間に生きる。' },
  22: { label: 'マスター22 — 創造者', desc: '夢を現実の建築物にする力。最も実践的な神秘家。' },
  33: { label: 'マスター33 — 愛の教師', desc: '無条件の愛を体現する稀有な魂。' }
};

function personalYear(m, d, currentYear) {
  const sum = reduceDigit(m, false) + reduceDigit(d, false) + reduceDigit(currentYear, false);
  return reduceDigit(sum, false);
}

// ============ 六十干支 (年柱) ============
function sixtyJikkan(year) {
  const stems    = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
  const branches = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  const elements = ['木','火','土','金','水'];
  const yinyang  = ['陽','陰'];
  const idx = ((year - 4) % 60 + 60) % 60;
  return {
    name: stems[idx % 10] + branches[idx % 12],
    element: elements[Math.floor((idx % 10) / 2)],
    yinyang: yinyang[(idx % 10) % 2]
  };
}

// ============ バイオリズム ============
function biorhythm(y, m, d) {
  const birth = new Date(y, m - 1, d);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const days = Math.floor((today - birth) / 86400000);
  return {
    days,
    physical:     Math.sin(2 * Math.PI * days / 23),
    emotional:    Math.sin(2 * Math.PI * days / 28),
    intellectual: Math.sin(2 * Math.PI * days / 33),
    intuitive:    Math.sin(2 * Math.PI * days / 38)
  };
}

// ============ 今日の月相 ============
function moonPhaseToday() {
  const ref = new Date(Date.UTC(2000, 0, 6, 18, 14));
  const now = new Date();
  const days = (now - ref) / 86400000;
  const cycle = 29.530588;
  const phase = (((days % cycle) + cycle) % cycle) / cycle;
  let name;
  if (phase < 0.03 || phase > 0.97)      name = '新月';
  else if (phase < 0.22)                  name = '三日月(若月)';
  else if (phase < 0.28)                  name = '上弦の月';
  else if (phase < 0.47)                  name = '十三夜・満ちゆく月';
  else if (phase < 0.53)                  name = '満月';
  else if (phase < 0.72)                  name = '十六夜・欠けゆく月';
  else if (phase < 0.78)                  name = '下弦の月';
  else                                    name = '有明月';
  return { phase, name };
}

// ============ 名前の数秘 (Expression Number) ============
function expressionNumber(name) {
  let sum = 0;
  for (const c of name) {
    if (/\s/.test(c)) continue;
    sum += c.codePointAt(0);
  }
  let n = sum % 9;
  if (n === 0) n = 9;
  return n;
}

function dailyTarot(name) {
  const today = new Date();
  let h = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
  for (const c of name) h = (h * 31 + c.codePointAt(0)) % 1000003;
  const cards = Object.keys(tarotMeanings);
  const card = cards[h % cards.length];
  return { name: card, desc: tarotMeanings[card] };
}

// 真の月星座は出生時刻が必要だが、生年月日のみから「月の傾向」を一つ示す
function moonTrait(y, m, d) {
  const birth = new Date(Date.UTC(y, m - 1, d));
  const ref = new Date(Date.UTC(2000, 0, 6, 18, 14));
  const days = (birth - ref) / 86400000;
  const cycle = 29.530588;
  const phase = (((days % cycle) + cycle) % cycle) / cycle;
  const traits = [
    { name: '新月期生まれ',     desc: '内側に芽吹くものを抱えて生まれた魂。直感的で本能的。' },
    { name: '上弦期生まれ',     desc: '挑戦と行動の波で生まれた魂。前に出る力が強い。' },
    { name: '満月期生まれ',     desc: '感情と意識が拮抗する魂。表現力と人を惹きつける力。' },
    { name: '下弦期生まれ',     desc: '手放しと内省の波で生まれた魂。深さと知恵を持つ。' }
  ];
  let idx;
  if (phase < 0.25) idx = 0;
  else if (phase < 0.5) idx = 1;
  else if (phase < 0.75) idx = 2;
  else idx = 3;
  return traits[idx];
}

// ============ サマリー文章の生成 ============
function generateSummary(name, results) {
  const { lp, sun, cz, ks, gy, an, ct, my, tb, py, currentYear, bio, mt, ls, mp } = results;
  const lpInfo = lifePathMeanings[lp];
  const bioAvg = (bio.physical + bio.emotional + bio.intellectual + bio.intuitive) / 4;
  const bioState = bioAvg > 0.25
    ? '<strong>上昇のフェーズ</strong>(行動と発信に向く)'
    : bioAvg < -0.25
      ? '<strong>内省のフェーズ</strong>(休息と整理に向く)'
      : '<strong>バランスの取れたフェーズ</strong>';

  return `
    <div class="summary-label">あなたの物語</div>
    <p class="summary-lead">
      ${escapeHtml(name)}さんは、<strong>${lpInfo.label}</strong>の魂を持って生まれた人です。
    </p>
    <p>
      西洋占星術では <strong>${sun.name}</strong>(${sun.element}のエレメント)を太陽に宿し、
      東洋の暦では <strong>${cz.name}</strong>、九星では <strong>${ks.name}</strong> のもと、
      <strong>${gy.element}</strong> の元素を芯に持っています。
      動物占いでは <strong>${an.name}</strong>、ケルトの森ではあなたの守護樹は <strong>${ct.name}</strong>。
      マヤの聖暦では <strong>KIN ${my.kin} ・ ${my.tone}${my.seal}</strong>、
      タロットの原型は <strong>${tb.name}</strong> です。
    </p>
    <p>
      ${currentYear}年の今、あなたは <strong>個人年 ${py}</strong> の波にいます。
      バイオリズム的には ${bioState}。
      ${mt.name}としての気質を背負いながら、今夜は <strong>${mp.name}</strong> があなたを照らします。
      ${ls.next ? `次の人生の節目は <strong>${ls.next.age}歳の${ls.next.name}</strong>。あと <strong>${(ls.next.age - ls.years).toFixed(1)}年</strong> 先です。` : ''}

      ↓ 各カードをタップすると、より深い解釈が開きます

}

// ============ モーダル制御 ============
function openModal(cardKey) {
  if (!currentContext) return;
  const data = buildDeep(cardKey, currentContext);
  if (!data) return;
  const modal = document.getElementById('modal');
  modal.dataset.cardKey = cardKey;
  document.getElementById('modal-body').innerHTML = renderModalBody(data);
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  const modal = document.getElementById('modal');
  modal.classList.remove('open');
  document.body.style.overflow = '';
}

      ${card('lifepath', 'ライフパスナンバー', lp, lifePathMeanings[lp].label, lifePathMeanings[lp].desc)}
      ${card('personalYear', '今年の個人年', py, `${currentYear}年のあなた`, personalYearMeanings[py])}
      ${card('expression', 'お名前の数字', en, '名前から響く波動', expressionMeanings[en])}
    </div>

    <div class="section-title">西洋占星術<span class="section-en">Western Astrology</span></div>
    <div class="grid">
      ${card('sun', '太陽星座', `${sun.symbol} ${sun.name}`, `${sun.element}のエレメント`, sun.desc)}
      ${card('moonTrait', '月の傾向', mt.name, '誕生時の月の位相から', mt.desc + '<div class="note">正確な月星座は出生時刻が必要です</div>')}
    </div>

    <div class="section-title">東洋の星と命<span class="section-en">Eastern</span></div>
    <div class="grid">
      ${card('zodiac', '十二支', cz.name, `${cz.char}年生まれ`, cz.desc)}
      ${card('sixty', '年柱(六十干支)', sj.name, `${sj.yinyang}${sj.element}`, `60年に一度しか巡らない刻印。${sj.element}の性質を帯びる。`)}
      ${card('kyusei', '本命星(九星気学)', ks.name, `${ks.element}の星`, ks.desc)}
      ${card('gogyou', '五行', gy.element, '生まれ年の元素', gy.desc)}
    </div>

    <div class="section-title">キャラクター占い<span class="section-en">Characters</span></div>
    <div class="grid">
      ${card('animal', '動物占い', an.name, `個性番号 ${an.num}/60`, animalDesc[an.name] || '独自の個性を持つ存在。')}
      ${card('celtic', 'ケルト樹木占い', ct.name, '13本の木のうちの一本', ct.desc)}
    </div>

    <div class="section-title">マヤ暦・タロット<span class="section-en">Sacred Symbols</span></div>
    <div class="grid">
      ${card('maya', 'マヤ暦 KIN', `KIN ${my.kin}`, `${my.tone}${my.seal}`, '260日の聖なる暦の中の、あなたの一日。紋章は本質、銀河の音はリズム。')}
      ${card('tarotBirth', 'タロット バースカード', tb.name, `大アルカナ ${tb.num}`, tarotMeanings[tb.name])}
      ${card('tarotDaily', '今日のカード', dt.name, `${today.getFullYear()}/${today.getMonth() + 1}/${today.getDate()} のあなたへ`, dt.desc)}
    </div>

    <div class="section-title">自然のシンボル<span class="section-en">Nature</span></div>
    <div class="grid">
      ${card('birthstone', '誕生石', bs.name, `${m}月の石`, bs.meaning)}
      ${card('birthflower', '誕生花', bf, `${m}月の花`, '誕生月の象徴。あなたの周りに置くと心が整う。')}
    </div>

    <div class="section-title">今日の波<span class="section-en">Cycles</span></div>
    <div class="grid">
      <div class="card" data-key="biorhythm" style="grid-column: 1 / -1;">
        <div class="card-system">バイオリズム — 出生から ${bio.days.toLocaleString()} 日目</div>
        ${bioBar('身体', bio.physical)}
        ${bioBar('感情', bio.emotional)}
        ${bioBar('知性', bio.intellectual)}
        ${bioBar('直感', bio.intuitive)}
        <div class="card-more">深く読み解く</div>
      </div>
      <div class="card" data-key="moon" style="grid-column: 1 / -1;">
        <div style="display: grid; grid-template-columns: 100px 1fr; gap: 28px; align-items: center;">
          <div class="moon">${moonSvg(mp.phase)}</div>
          <div>
            <div class="card-system">今夜の月</div>
            <div class="card-value">${mp.name}</div>
            <div class="card-desc">月相 ${(mp.phase * 100).toFixed(1)}% ・ 月の満ち欠けはすべての生命に影響する。今夜の月はあなたに何を告げる?</div>
          </div>
        </div>
        <div class="card-more">深く読み解く</div>
      </div>
    </div>

    <div class="section-title">人生の地図<span class="section-en">Life Map</span></div>
    <div class="grid">
      ${ls.prev ? card('lifeStagePrev', '直近の節目', `${ls.prev.age}歳`, ls.prev.name, ls.prev.desc) : ''}
      ${ls.next ? card('lifeStageNext', '次の節目', `${ls.next.age}歳`, ls.next.name, ls.next.desc) : ''}
    </div>
  `;

  const r = document.getElementById('results');
  r.innerHTML = html;
  r.classList.add('active');

  // カードのクリックイベント
  r.querySelectorAll('.card[data-key]').forEach(el => {
    el.addEventListener('click', () => openModal(el.dataset.key));
  });

  setTimeout(() => r.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
}

function card(key, system, value, label, desc) {
  return `
    <div class="card" data-key="${key}">
      <div class="card-system">${system}</div>
      <div class="card-value">${value}</div>
      <div class="card-label">${label}</div>
      <div class="card-desc">${desc}</div>
      <div class="card-more">深く読み解く</div>
    </div>
  `;
}

function bioBar(label, val) {
  const pct = (val + 1) / 2 * 100;
  const cls = val < 0 ? 'bio-fill neg' : 'bio-fill';
  return `
    <div class="bio-bar">
      <div class="bio-label">${label}</div>
      <div class="bio-track">
        <div class="bio-center"></div>
        <div class="${cls}" style="width:${pct}%"></div>
      </div>
      <div class="bio-value">${(val * 100).toFixed(0)}</div>
    </div>
  `;
}

function moonSvg(phase) {
  const cx = 50, cy = 50, r = 46;
  const dark = '#0a0816';
  const light = '#f5d76e';
  let leftHalf, rightHalf, ellipse;

  if (phase < 0.5) {
    leftHalf  = `<path d="M ${cx},${cy - r} A ${r},${r} 0 0,0 ${cx},${cy + r} Z" fill="${dark}"/>`;
    rightHalf = `<path d="M ${cx},${cy - r} A ${r},${r} 0 0,1 ${cx},${cy + r} Z" fill="${light}"/>`;
    const ellipseR = Math.abs(Math.cos(2 * Math.PI * phase)) * r;
    const fill = phase < 0.25 ? dark : light;
    ellipse = `<ellipse cx="${cx}" cy="${cy}" rx="${ellipseR}" ry="${r}" fill="${fill}"/>`;
  } else {
    leftHalf  = `<path d="M ${cx},${cy - r} A ${r},${r} 0 0,0 ${cx},${cy + r} Z" fill="${light}"/>`;
    rightHalf = `<path d="M ${cx},${cy - r} A ${r},${r} 0 0,1 ${cx},${cy + r} Z" fill="${dark}"/>`;
    const ellipseR = Math.abs(Math.cos(2 * Math.PI * phase)) * r;
    const fill = phase > 0.75 ? dark : light;
    ellipse = `<ellipse cx="${cx}" cy="${cy}" rx="${ellipseR}" ry="${r}" fill="${fill}"/>`;
  }

  return `<svg viewBox="0 0 100 100">
    <defs>
      <clipPath id="moonClip"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath>
    </defs>
    <g clip-path="url(#moonClip)">
      ${leftHalf}${rightHalf}${ellipse}
    </g>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(212,175,55,0.35)" stroke-width="1"/>
  </svg>`;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

document.getElementById('birthdate').max = new Date().toISOString().split('T')[0];
</script>
