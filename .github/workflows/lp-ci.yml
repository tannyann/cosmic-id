name: LP CI

on:
  push:
    paths:
      - 'lp/**'
  pull_request:
    paths:
      - 'lp/**'

defaults:
  run:
    working-directory: lp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lp/package-lock.json

      - run: npm ci
      - run: npm run build
